<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ouinux</title>
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<style>
  /* Même direction artistique que la page de téléchargement : sombre, néon violet */
  :root {
    color-scheme: dark;
    --bg: #0b0912; --panel: rgba(24, 19, 38, .78); --panel-plein: #15111f; --text: #ece9f5; --muted: #a39fb5;
    --violet: #a78bfa; --violet-fort: #8b5cf6; --rose: #ec4899;
    --contour: rgba(167, 139, 250, .25); --contour-fort: rgba(167, 139, 250, .6); --hover: rgba(139, 92, 246, .14);
    --linux: #4ade80; --windows: #7aa7ff; --unknown: #a39fb5;
    --linux-bg: rgba(74, 222, 128, .1); --windows-bg: rgba(96, 145, 255, .1); --unknown-bg: rgba(163, 159, 181, .1);
  }
  * { box-sizing: border-box; }
  html { height: 100%; background: var(--bg); }
  /* pas de fond sur body : il masquerait le décor (.fond, z-index -1) */
  body { height: 100%; margin: 0; color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", "Noto Sans", sans-serif;
         display: flex; flex-direction: column; }
  .fond { position: fixed; inset: 0; z-index: -1; pointer-events: none;
          background: radial-gradient(500px 380px at 50% 30%, rgba(139, 92, 246, .14), transparent 70%),
                      radial-gradient(380px 300px at 100% 0%, rgba(236, 72, 153, .07), transparent 70%),
                      radial-gradient(420px 320px at 0% 100%, rgba(139, 92, 246, .08), transparent 70%); }
  .fond svg { width: 100%; height: 100%; }
  ::selection { background: rgba(139, 92, 246, .45); }

  /* au-dessus des fiches (leur flou crée aussi une couche) : sinon elles recouvrent la liste des suggestions */
  header { padding: 14px 18px 14px; border-bottom: 1px solid var(--contour); background: rgba(14, 11, 22, .72);
           backdrop-filter: blur(10px); position: relative; z-index: 20; }
  header h1 { font-size: 20px; margin: 0 0 2px; display: flex; align-items: center; gap: 9px; letter-spacing: -.01em; }
  header h1 .logo { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 14px rgba(139, 92, 246, .45); }
  header h1 .nom { font-weight: 800; background: linear-gradient(90deg, var(--violet), #c084fc 50%, var(--rose));
                   -webkit-background-clip: text; background-clip: text; color: transparent; }
  #langue { margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 99px; }
  #pc { color: var(--muted); font-size: 13px; min-height: 20px; }
  .recherche { position: relative; max-width: 760px; margin: 12px auto 0; }
  #q { width: 100%; font: inherit; color: var(--text); background: rgba(139, 92, 246, .06);
       border: 1px solid var(--contour-fort); border-radius: 12px; padding: 11px 15px; outline: none;
       transition: box-shadow .2s, border-color .2s; }
  #q::placeholder { color: var(--muted); }
  #q:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 92, 246, .18), 0 0 24px rgba(139, 92, 246, .25); }
  #liste { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 10; background: var(--panel-plein);
           border: 1px solid var(--contour-fort); border-radius: 12px; overflow: hidden; display: none;
           box-shadow: 0 0 30px rgba(139, 92, 246, .25), 0 14px 30px rgba(0, 0, 0, .5); }
  #liste.ouverte { display: block; }
  .sugg { display: flex; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; }
  .sugg.actif, .sugg:hover { background: var(--hover); }
  .sugg img, .sugg .vide { width: 92px; height: 34px; object-fit: cover; border-radius: 5px; background: #1c1729; flex: none; }
  .sugg span { font-size: 14px; flex: 1; }
  .sugg small { font-size: 11px; color: var(--violet); border: 1px solid var(--contour); border-radius: 99px; padding: 0 8px; }

  main { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .accueil { color: var(--muted); text-align: center; margin-top: 7vh; }
  .accueil p { max-width: 440px; margin: 0 auto 14px; }
  .accueil button { margin: 4px; border-radius: 99px; }
  button { font: inherit; border: 1px solid var(--contour); background: rgba(139, 92, 246, .08); color: var(--text);
           border-radius: 10px; padding: 7px 14px; cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; }
  button:hover:not(:disabled) { border-color: var(--contour-fort); background: rgba(139, 92, 246, .16);
                                box-shadow: 0 0 16px rgba(139, 92, 246, .2); }
  button:disabled { opacity: .45; cursor: default; }
  button.principal { border: 0; color: #fff; font-weight: 600; background: linear-gradient(90deg, var(--rose), var(--violet-fort));
                     box-shadow: 0 4px 18px rgba(236, 72, 153, .3); }
  .attente { color: var(--muted); font-style: italic; text-align: center; }
  .erreur { color: #f87171; text-align: center; }
  .bandeau { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel);
             border: 1px solid var(--contour-fort); border-radius: 14px; padding: 10px 12px; font-size: 13px;
             box-shadow: 0 0 24px rgba(139, 92, 246, .18); }
  .bandeau img { width: 30px; height: 30px; border-radius: 50%; }
  .bandeau span { flex: 1; min-width: 180px; }
  .bandeau button { padding: 4px 12px; font-size: 13px; }

  .carte { background: var(--panel); border: 1px solid var(--contour); border-radius: 16px; overflow: hidden;
           position: relative; backdrop-filter: blur(6px); box-shadow: 0 0 30px rgba(139, 92, 246, .12);
           transition: border-color .2s, box-shadow .2s; }
  .carte:hover { border-color: var(--contour-fort); box-shadow: 0 0 36px rgba(139, 92, 246, .22); }
  .carte .banniere { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; display: block; max-height: 150px;
                     mask-image: linear-gradient(#000 60%, transparent); -webkit-mask-image: linear-gradient(#000 60%, transparent); }
  .carte .corps { padding: 14px 18px 16px; }
  .carte .banniere + .corps { margin-top: -26px; position: relative; }
  .carte h3 { margin: 0 0 8px; font-size: 18px; padding-right: 28px; letter-spacing: .01em; }
  .fermer { position: absolute; top: 9px; right: 9px; z-index: 1; border: 1px solid var(--contour); background: rgba(11, 9, 18, .65);
            color: #fff; width: 28px; height: 28px; padding: 0; border-radius: 50%; font-size: 13px; line-height: 26px; }
  .badge { display: inline-block; font-weight: 700; font-size: 13px; padding: 3px 12px; border-radius: 99px;
           background: var(--cbg); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .conf { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .carte ul { margin: 10px 0 8px; padding-left: 18px; font-size: 14px; color: #d6d2e6; }
  .carte li { margin-bottom: 3px; }
  .carte li::marker { color: var(--violet); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .carte a { color: var(--violet); font-size: 12px; margin-right: 14px; text-underline-offset: 3px; }
  .carte a:hover { color: #c4b5fd; }
  /* Mots clés : violet souligné, comme sur la page de téléchargement */
  .k { color: var(--violet); font-weight: 600; text-decoration: underline; text-decoration-color: rgba(167, 139, 250, .5);
       text-decoration-thickness: 2px; text-underline-offset: 3px; }

  .perf, .pc { margin: 12px 0 8px; padding: 12px 14px; border: 1px solid var(--contour); border-radius: 12px;
               background: rgba(255, 255, 255, .02); }
  .perf .titre { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .jauge { position: relative; height: 10px; border-radius: 99px; margin: 7px 0;
           background: linear-gradient(90deg, var(--windows-bg), rgba(255, 255, 255, .03) 50%, var(--linux-bg));
           border: 1px solid var(--contour); }
  .jauge .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
  .jauge .marge { position: absolute; top: 1px; bottom: 1px; border-radius: 99px; opacity: .45; }
  .jauge .point { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
                  transform: translate(-50%, -50%); border: 2px solid #1a1626; box-shadow: 0 0 10px currentColor; }
  .res { font-size: 14px; font-weight: 600; }
  .det { font-size: 12.5px; color: var(--muted); }
  .pc .entete { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pc .entete b { font-size: 14px; }
  .choix { display: inline-flex; border: 1px solid var(--contour); border-radius: 99px; overflow: hidden; }
  .choix button { border: 0; border-radius: 0; padding: 3px 13px; font-size: 12px; background: transparent; box-shadow: none; }
  .choix button.actif { background: linear-gradient(90deg, var(--rose), var(--violet-fort)); color: #fff; font-weight: 700; }
  .choix button:disabled { opacity: .35; }
  .niv { position: relative; height: 8px; border-radius: 99px; margin: 12px 0 5px;
         background: linear-gradient(90deg, #d64545 0%, #e8833a 20%, #e6c229 42%, #7cc35a 62%, #2fa866 100%); opacity: .9; }
  .niv .point { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: #fff;
                border: 3px solid #1a1626; transform: translate(-50%, -50%); transition: left .35s ease;
                box-shadow: 0 0 12px rgba(167, 139, 250, .7); }
  .niv-lab { position: relative; height: 15px; font-size: 11px; color: var(--muted); }
  .niv-lab span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .niv-lab span:first-child { transform: none; } .niv-lab span:last-child { transform: translateX(-100%); }
  .pc ul { list-style: none; padding: 0; margin: 8px 0 4px; font-size: 13px; }
  .Linux { --c: var(--linux); --cbg: var(--linux-bg); }
  .Windows { --c: var(--windows); --cbg: var(--windows-bg); }
  .Inconnu { --c: var(--unknown); --cbg: var(--unknown-bg); }
  footer { text-align: center; color: var(--muted); font-size: 11px; padding: 7px; border-top: 1px solid rgba(167, 139, 250, .12); }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, .25); border-radius: 99px; border: 3px solid transparent;
                                  background-clip: padding-box; }
</style>
</head>
<body>
<div class="fond" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 600 900">
    <g fill="none" stroke="#a78bfa" stroke-opacity=".08" stroke-width="1.2">
      <polygon points="40,120 90,91 140,120 140,178 90,207 40,178"/>
      <polygon points="470,640 520,611 570,640 570,698 520,727 470,698"/>
      <polygon points="500,90 570,215 430,215"/>
      <polygon points="80,640 140,750 20,750"/>
      <circle cx="540" cy="420" r="46"/>
      <circle cx="40" cy="430" r="28"/>
      <rect x="300" y="800" width="60" height="60" transform="rotate(25 330 830)"/>
      <rect x="250" y="40" width="40" height="40" transform="rotate(-15 270 60)"/>
      <line x1="0" y1="540" x2="200" y2="900"/>
      <line x1="420" y1="0" x2="600" y2="260"/>
    </g>
  </svg>
</div>
<header>
  <div class="col" style="gap:0">
    <h1><img class="logo" src="/icone.svg" alt=""><span class="nom">Ouinux</span>
      <button id="langue" type="button" title="Language / Langue"></button></h1>
    <div id="pc" data-t>Detecting your PC…</div>
  </div>
  <div class="recherche">
    <input id="q" type="text" placeholder="Search a game: Steam, Battle.net, Epic, Ubisoft, EA…" data-t-placeholder autocomplete="off" autofocus>
    <div id="liste" role="listbox"></div>
  </div>
</header>
<main><div class="col" id="col">
  <div class="accueil" id="accueil">
    <p data-t>Type a game's name: I'll tell you whether it works on Linux or if you should stay on Windows, and how your PC will handle it.</p>
    <button data-nom="Elden Ring" data-appid="1245620">Elden Ring</button>
    <button data-nom="Valorant">Valorant</button>
    <button data-nom="Baldur's Gate 3" data-appid="1086940">Baldur's Gate 3</button>
    <button data-nom="Counter-Strike 2" data-appid="730">Counter-Strike 2</button>
    <button data-nom="World of Warcraft" data-slug="world-of-warcraft">World of Warcraft</button>
  </div>
</div></main>
<footer id="pied" data-t>Data: ProtonDB, AreWeAntiCheatYet, Steam, Lutris, PCGamingWiki · estimates, not measurements</footer>
<script>
const col = document.getElementById('col'), q = document.getElementById('q'), liste = document.getElementById('liste');
let PC = null, suggs = [], actif = -1, minuteur = null, requete = 0;

// ---------- Langue : textes en anglais, traduits si la langue du système en a une ----------
const LANGUES = { fr: {
  'Detecting your PC…': 'Détection de ton PC…',
  'Search a game: Steam, Battle.net, Epic, Ubisoft, EA…': 'Cherche un jeu : Steam, Battle.net, Epic, Ubisoft, EA…',
  "Type a game's name: I'll tell you whether it works on Linux or if you should stay on Windows, and how your PC will handle it.":
    "Tape le nom d'un jeu : je te dis s'il fonctionne sous Linux ou s'il faut rester sur Windows, et comment ton PC s'en sortira.",
  'Data: ProtonDB, AreWeAntiCheatYet, Steam, Lutris, PCGamingWiki · estimates, not measurements':
    'Données : ProtonDB, AreWeAntiCheatYet, Steam, Lutris, PCGamingWiki · estimations, pas des mesures',
  'Hardware not detected': 'Matériel non détecté',
  'Add Ouinux to your applications menu, with its icon?': 'Ajouter Ouinux au menu des applications, avec son icône ?',
  'Add': 'Ajouter', 'No thanks': 'Non merci',
  '✅ Ouinux is now in your applications menu.': '✅ Ouinux est maintenant dans le menu des applications.',
  '{nom}: {texte}': '{nom} : {texte}',
  'Unknown processor': 'Processeur inconnu', 'Unknown graphics card': 'Carte graphique inconnue',
  'Checking {nom}: anti-cheat, ProtonDB, Steam requirements…': 'Je vérifie {nom} : anti-triche, ProtonDB, configuration Steam…',
  "⚠️ Couldn't analyse {nom}: {err}. Check your Internet connection.": "⚠️ Impossible d'analyser {nom} : {err}. Vérifie ta connexion Internet.",
  'estimated performance': 'perfs estimées',
  'Estimate: {n}% for Linux (range {bas} to +{haut}%)': 'Estimation : {n} % pour Linux (marge {bas} à +{haut} %)',
  'PCGamingWiki source ↗': 'Source PCGamingWiki ↗',
  '🎯 Your PC for this game': '🎯 Ton PC pour ce jeu',
  'below min': 'sous le min', 'minimum': 'minimum', 'recommended': 'recommandé', 'above': 'au-dessus',
  "Rough estimate: your setup compared with the game's Steam requirements.":
    'Approximation : ta config comparée à celle demandée par le jeu sur Steam.',
  "Won't launch on Linux (anti-cheat)": 'Ne se lance pas sous Linux (anti-triche)',
  'Limiting factor: ': 'Facteur limitant : ',
  '🐧 Works on Linux': '🐧 Fonctionne sous Linux', '🪟 Windows required': '🪟 Windows nécessaire', '❓ Unknown': '❓ Inconnu',
  'Remove': 'Retirer',
  'confidence {c}': 'confiance {c}', 'high': 'haute', 'medium': 'moyenne', 'low': 'basse',
  '📊 Performance preview unavailable': '📊 Aperçu des perfs non disponible',
  "Online play won't launch on Linux (anti-cheat), so no comparison is possible.":
    'Le jeu en ligne ne se lance pas sous Linux (anti-triche), donc pas de comparaison possible.',
  "The game's graphics API is unknown (no PCGamingWiki page). It doesn't change the verdict.":
    'Technologie graphique du jeu inconnue (pas de fiche PCGamingWiki). Ça ne change rien au verdict.',
  'Analyse "{s}"': 'Analyser « {s} »',
  'ProtonDB {tier} ({n} reports)': 'ProtonDB {tier} ({n} avis)',
  'Steam Deck: {d}': 'Steam Deck : {d}', 'Anti-cheat: {s}': 'Anti-triche : {s}',
  'verified': 'vérifié', 'playable': 'jouable', 'unsupported': 'non supporté',
  '🛒 Available on: ': '🛒 Disponible sur : ',
  'View on Lutris ↗': 'Voir sur Lutris ↗', 'View on ProtonDB ↗': 'Voir sur ProtonDB ↗',
} };
const LANGUE_CHOISIE = null;  // remplacée par le serveur quand l'utilisateur a choisi avec le bouton FR/EN
const LANGUE_SYSTEME = (navigator.language || 'en').slice(0, 2).toLowerCase();
const LANG = LANGUE_CHOISIE || (LANGUE_SYSTEME in LANGUES ? LANGUE_SYSTEME : 'en');
function t(texte, valeurs = {}) {
  const tr = (LANGUES[LANG] || {})[texte] ?? texte;
  return tr.replace(/\{(\w+)\}/g, (m, k) => k in valeurs ? valeurs[k] : m);
}
document.documentElement.lang = LANG;
document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.textContent.trim()); });
document.querySelectorAll('[data-t-placeholder]').forEach(e => { e.placeholder = t(e.placeholder); });

// Bouton de langue : affiche l'autre langue, la mémorise, recharge la page
const bLangue = document.getElementById('langue');
bLangue.textContent = LANG === 'fr' ? 'EN' : 'FR';
bLangue.onclick = async () => {
  await fetch('/api/langue?l=' + (LANG === 'fr' ? 'en' : 'fr'), { method: 'POST' }).catch(() => {});
  location.reload();
};

// Mots clés mis en valeur (violet souligné) dans les textes du verdict
const MOTS_CLES = ['ProtonDB', 'Proton', 'Steam Deck', 'Lutris', 'Heroic Games Launcher', 'Wine', 'anti-cheat', 'anti-triche',
  'Vulkan', 'DirectX 12', 'DirectX 11', 'VKD3D', 'DXVK', 'OpenGL', 'Mesa', 'ray tracing', 'Platinum', 'Gold', 'Silver',
  'Bronze', 'Borked', 'native Linux version', 'version Linux native', 'Linux native', 'Vanguard', 'EasyAntiCheat',
  'BattlEye', 'FACEIT', 'Easy Anti-Cheat', 'EA App', 'Battle.net', 'Epic'].sort((a, b) => b.length - a.length);
const RE_MOTS = new RegExp('(?<![\\p{L}\\d])(' + MOTS_CLES.map(m => m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')
  + ')(?![\\p{L}\\d])', 'giu');
function elk(tag, cls, txt) {  // comme el(), avec les mots clés en valeur (texte inséré sans HTML)
  const e = el(tag, cls), vus = new Set();  // seulement la 1re apparition de chaque mot : reste lisible
  String(txt).split(RE_MOTS).forEach((morceau, i) => {
    if (!morceau) return;
    const cle = morceau.toLowerCase();
    if (i % 2 && !vus.has(cle)) { vus.add(cle); e.append(el('span', 'k', morceau)); } else e.append(morceau);
  });
  return e;
}

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

fetch('/api/pc').then(r => r.json()).then(pc => {
  PC = pc;
  const ram = pc.ram_go ? ` · ${pc.ram_go} ${LANG === 'fr' ? 'Go' : 'GB'} RAM` : '';
  document.getElementById('pc').textContent = `${{ windows: '🪟', macos: '🍎' }[pc.os] || '🐧'} ${pc.os_nom} · ${t(pc.cpu)} · ${t(pc.gpu)}${ram}`;
  document.getElementById('pied').textContent += ` · v${pc.version}`;
  if (pc.raccourci === 'absent') proposerRaccourci();
}).catch(() => { document.getElementById('pc').textContent = t('Hardware not detected'); });

// Linux : proposer un raccourci dans le menu des applications (une seule fois)
function proposerRaccourci() {
  const b = el('div', 'bandeau'), im = el('img'); im.src = '/icone.svg'; im.alt = '';
  const oui = el('button', 'principal', t('Add')), non = el('button', null, t('No thanks'));
  b.append(im, el('span', null, t('Add Ouinux to your applications menu, with its icon?')), oui, non);
  const repondre = async ajouter => {
    try {
      const r = await (await fetch('/api/raccourci?ajouter=' + (ajouter ? 1 : 0), { method: 'POST' })).json();
      if (ajouter && r.raccourci === 'present') {
        b.replaceChildren(el('span', null, t('✅ Ouinux is now in your applications menu.')));
        setTimeout(() => b.remove(), 4000);
        return;
      }
    } catch { /* tant pis : on reproposera au prochain lancement */ }
    b.remove();
  };
  oui.onclick = () => repondre(true); non.onclick = () => repondre(false);
  col.prepend(b);
}

// ---------- Recherche avec suggestions ----------
function fermerListe() { liste.classList.remove('ouverte'); actif = -1; }

function afficherListe() {
  liste.replaceChildren();
  suggs.forEach((s, i) => {
    const d = el('div', 'sugg' + (i === actif ? ' actif' : ''));
    if (s.image) { const im = el('img'); im.src = s.image; im.alt = ''; d.appendChild(im); } else d.appendChild(el('div', 'vide'));
    d.appendChild(el('span', null, s.nom));
    if (s.source) d.appendChild(el('small', null, s.source));
    d.onmousedown = e => { e.preventDefault(); choisir(s); };
    liste.appendChild(d);
  });
  liste.classList.toggle('ouverte', suggs.length > 0);
}

q.addEventListener('input', () => {
  clearTimeout(minuteur);
  const texte = q.value.trim();
  if (texte.length < 2) { suggs = []; fermerListe(); return; }
  minuteur = setTimeout(async () => {
    const n = ++requete;
    try {
      const r = await (await fetch('/api/suggestions?lang=' + LANG + '&q=' + encodeURIComponent(texte))).json();
      if (n !== requete) return;  // une frappe plus récente a déjà répondu
      suggs = r; actif = -1; afficherListe();
    } catch { /* hors ligne : pas de suggestions */ }
  }, 250);
});

q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && suggs.length) { actif = (actif + 1) % suggs.length; afficherListe(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && suggs.length) { actif = (actif - 1 + suggs.length) % suggs.length; afficherListe(); e.preventDefault(); }
  else if (e.key === 'Escape') fermerListe();
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (actif >= 0) choisir(suggs[actif]);
    else if (q.value.trim()) choisir({ nom: q.value.trim(), appid: null, slug: null });
  }
});
q.addEventListener('blur', () => setTimeout(fermerListe, 100));

function choisir(s) {
  q.value = ''; suggs = []; fermerListe(); clearTimeout(minuteur); requete++;
  analyser(s.nom, s.appid, s.slug);
}

// ---------- Analyse ----------
async function analyser(nom, appid, slug) {
  document.getElementById('accueil')?.remove();
  const att = el('div', 'attente', t('Checking {nom}: anti-cheat, ProtonDB, Steam requirements…', { nom }));
  col.prepend(att);
  try {
    const url = '/api/analyse?lang=' + LANG + '&nom=' + encodeURIComponent(nom) + (appid ? '&appid=' + appid : '')
              + (slug ? '&slug=' + encodeURIComponent(slug) : '');
    const r = await fetch(url); const a = await r.json();
    if (!r.ok) throw new Error(a.erreur || r.statusText);
    att.replaceWith(carte(a));
  } catch (e) {
    att.replaceWith(el('div', 'erreur', t("⚠️ Couldn't analyse {nom}: {err}. Check your Internet connection.", { nom, err: e.message })));
  }
  document.querySelector('main').scrollTop = 0;
}

function jauge(p) {
  // échelle : -25 % (Windows plus fluide, à gauche) … +25 % (Linux plus fluide, à droite)
  const pos = v => Math.max(0, Math.min(100, 50 + v * 2)) + '%';
  const couleur = v => v > 5 ? 'var(--linux)' : v < -5 ? 'var(--windows)' : 'var(--muted)';
  const w = el('div', 'perf');
  const ti = el('div', 'titre'); ti.append(el('span', null, '🪟 Windows'), el('span', null, t('estimated performance')), el('span', null, 'Linux 🐧'));
  w.appendChild(ti);
  const j = el('div', 'jauge'); j.appendChild(el('div', 'zero'));
  const m = el('div', 'marge'); m.style.left = pos(p.bas); m.style.right = (100 - parseFloat(pos(p.haut))) + '%';
  m.style.background = couleur(p.centre); j.appendChild(m);
  const pt = el('div', 'point'); pt.style.left = pos(p.centre); pt.style.background = couleur(p.centre); j.appendChild(pt);
  j.title = t('Estimate: {n}% for Linux (range {bas} to +{haut}%)', { n: (p.centre > 0 ? '+' : '') + p.centre, bas: p.bas, haut: p.haut }).replace('+-', '-');
  w.appendChild(j);
  w.append(elk('div', 'res', p.resume), elk('div', 'det', p.explication));
  if (p.conseil) w.appendChild(elk('div', 'det', '💡 ' + p.conseil));
  if (p.rt) w.appendChild(elk('div', 'det', '✨ ' + p.rt));
  const src = el('a', null, t('PCGamingWiki source ↗')); src.href = p.source; src.target = '_blank'; src.style.color = 'var(--muted)';
  w.appendChild(src);
  return w;
}

function tonPc(m) {
  const w = el('div', 'pc');
  const ent = el('div', 'entete'); ent.appendChild(el('b', null, t('🎯 Your PC for this game')));
  const choix = el('div', 'choix');
  const bL = el('button', null, '🐧 Linux'), bW = el('button', null, '🪟 Windows');
  bL.type = bW.type = 'button'; choix.append(bL, bW); ent.appendChild(choix); w.appendChild(ent);
  const niv = el('div', 'niv'), pt = el('div', 'point'); niv.appendChild(pt); w.appendChild(niv);
  const lab = el('div', 'niv-lab');
  [['below min', 0], ['minimum', 25], ['recommended', 60], ['above', 100]].forEach(([s, x]) => {
    const e = el('span', null, t(s)); e.style.left = x + '%'; lab.appendChild(e); });
  w.appendChild(lab);
  const res = el('div', 'res'), txt = el('div', 'det'), lim = el('div', 'det');
  w.append(res, txt, lim);
  if (m.note) w.appendChild(elk('div', 'det', 'ℹ️ ' + m.note));
  const ul = el('ul'); m.details.forEach(d => ul.appendChild(el('li', null, `${d.etat} ` + t('{nom}: {texte}', d)))); w.appendChild(ul);
  w.appendChild(el('div', 'det', t("Rough estimate: your setup compared with the game's Steam requirements.")));
  function montrer(os) {
    const v = m[os];
    bL.classList.toggle('actif', os === 'linux'); bW.classList.toggle('actif', os === 'windows');
    w.style.setProperty('--c2', os === 'linux' ? 'var(--linux)' : 'var(--windows)');
    if (!v) { pt.style.left = '2%'; res.textContent = t("Won't launch on Linux (anti-cheat)"); txt.textContent = ''; lim.textContent = ''; return; }
    pt.style.left = v.position + '%';
    res.textContent = v.niveau; txt.textContent = v.texte; lim.textContent = t('Limiting factor: ') + v.limite;
  }
  bL.onclick = () => montrer('linux'); bW.onclick = () => montrer('windows');
  if (!m.linux) bL.disabled = true;
  // par défaut : le système sur lequel l'utilisateur est en ce moment
  montrer(m.linux && PC && PC.os === 'linux' ? 'linux' : 'windows');
  return w;
}

const BADGES = { Linux: '🐧 Works on Linux', Windows: '🪟 Windows required', Inconnu: '❓ Unknown' };

function carte(a) {
  const c = el('div', 'carte ' + a.verdict);
  const x = el('button', 'fermer', '✕'); x.title = t('Remove'); x.onclick = () => c.remove(); c.appendChild(x);
  if (a.image) { const im = el('img', 'banniere'); im.src = a.image; im.alt = ''; c.appendChild(im); }
  const corps = el('div', 'corps'); c.appendChild(corps);
  corps.appendChild(el('h3', null, a.jeu));
  const l = el('div'); l.appendChild(el('span', 'badge', t(BADGES[a.verdict])));
  l.appendChild(el('span', 'conf', t('confidence {c}', { c: t({ haute: 'high', moyenne: 'medium', basse: 'low' }[a.confiance] || a.confiance) }))); corps.appendChild(l);
  const bloque = a.anticheat && ['Denied', 'Broken'].includes(a.anticheat.statut);
  if (a.verdict !== 'Inconnu') {
    if (a.perf && !bloque) corps.appendChild(jauge(a.perf));
    else {
      const w = el('div', 'perf');
      w.appendChild(el('div', 'titre', t('📊 Performance preview unavailable')));
      w.appendChild(el('div', 'det', bloque
        ? t("Online play won't launch on Linux (anti-cheat), so no comparison is possible.")
        : t("The game's graphics API is unknown (no PCGamingWiki page). It doesn't change the verdict.")));
      corps.appendChild(w);
    }
    if (a.materiel) corps.appendChild(tonPc(a.materiel));
  }
  const ul = el('ul'); a.raisons.forEach(r => ul.appendChild(elk('li', null, r))); corps.appendChild(ul);
  if (a.suggestion) {
    const b = el('button', 'principal', t('Analyse "{s}"', { s: a.suggestion }));
    b.onclick = () => { c.remove(); analyser(a.suggestion, null); };
    corps.appendChild(b);
  }
  const m = [];
  if (a.protondb) m.push(t('ProtonDB {tier} ({n} reports)', { tier: a.protondb.tier, n: a.protondb.total }));
  if (a.steam_deck && a.steam_deck !== 'unknown') m.push(t('Steam Deck: {d}', { d: t(a.steam_deck) }));
  if (a.anticheat) m.push(t('Anti-cheat: {s}', { s: a.anticheat.statut }));
  if (m.length) corps.appendChild(el('div', 'meta', m.join(' · ')));
  if (a.plateformes && a.plateformes.length) corps.appendChild(el('div', 'meta', t('🛒 Available on: ') + a.plateformes.join(', ')));
  a.liens.forEach(u => {
    const x = el('a', null, t(u.includes('lutris.net') ? 'View on Lutris ↗' : 'View on ProtonDB ↗'));
    x.href = u; x.target = '_blank'; corps.appendChild(x); });
  return c;
}

// Signe de vie pour le serveur : sans fenêtre dédiée (mode navigateur), l'app s'arrête quand l'onglet est fermé
fetch('/api/ping'); setInterval(() => fetch('/api/ping').catch(() => {}), 20000);
addEventListener('pagehide', () => navigator.sendBeacon('/api/quitter'));

document.querySelectorAll('[data-nom]').forEach(b =>
  b.addEventListener('click', () => analyser(b.dataset.nom, b.dataset.appid ? +b.dataset.appid : null, b.dataset.slug)));
</script>
</body>
</html>
