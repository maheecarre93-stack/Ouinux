<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icône Ouinux en vectoriel : nette à toutes les tailles (l'image matricielle devient floue en petit) -->
  <defs>
    <radialGradient id="disque" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".65" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#2e1065"/>
    </radialGradient>
    <linearGradient id="anneau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation=".9" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#disque)"/>
  <circle cx="32" cy="32" r="29.2" fill="none" stroke="url(#anneau)" stroke-width="2.4" filter="url(#neon)"/>
  <g fill="none" stroke="#fbe7ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
    <!-- pingouin -->
    <path d="M24.5 27.5c0-6 3.3-10.5 7.5-10.5s7.5 4.5 7.5 10.5"/>
    <path d="M25 31c-2.2 3.2-3 7-2.4 10.6.8 4.6 4.6 7.4 9.4 7.4s8.6-2.8 9.4-7.4c.6-3.6-.2-7.4-2.4-10.6"/>
    <path d="M26 51.5h12"/>
    <!-- fléau et plateaux de la balance -->
    <path d="M14 29h36"/>
    <path d="M32 29v22.5"/>
    <path d="M17 29l-4 9M17 29l4 9M47 29l-4 9M47 29l4 9"/>
    <path d="M11.5 38h11c0 2.8-2.4 4.5-5.5 4.5s-5.5-1.7-5.5-4.5zM41.5 38h11c0 2.8-2.4 4.5-5.5 4.5s-5.5-1.7-5.5-4.5z"/>
  </g>
  <!-- yeux, bec, pivot -->
  <circle cx="29" cy="23" r="1.3" fill="#fbe7ff"/>
  <circle cx="35" cy="23" r="1.3" fill="#fbe7ff"/>
  <path d="M30.2 25.6h3.6L32 27.6z" fill="#f9a8d4"/>
  <circle cx="32" cy="29" r="1.9" fill="#fbe7ff"/>
</svg>
